name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Build the app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/bundle.sh
      - name: Package
        run: scripts/package.sh
      - name: Sign the update archive
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: swift scripts/sign-update.swift build/Macousel.zip build/Macousel.zip.sig
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/Macousel.dmg
            build/Macousel.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/Macousel.dmg build/Macousel.zip build/Macousel.zip.sig scripts/install.sh \
            --title "Macousel ${GITHUB_REF_NAME#v}" \
            --generate-notes
          sums="$(cd build && shasum -a 256 Macousel.dmg Macousel.zip)"
          body="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
          gh release edit "$GITHUB_REF_NAME" --notes "$(printf '%s\n\nSHA-256 sums\n\n```\n%s\n```\n' "$body" "$sums")"
