name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Build the app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/bundle.sh
      - name: Package
        run: scripts/package.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          build/Macousel.dmg build/Macousel.zip scripts/install.sh
          --title "Macousel ${GITHUB_REF_NAME#v}"
          --generate-notes
