name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  engine:
    if: github.event_name == 'push'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Read the engine version
        id: engine
        run: echo "version=$(tr -d '[:space:]' < support/engine-version)" >> "$GITHUB_OUTPUT"
      - name: Cache the engine
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/engine-${{ steps.engine.outputs.version }}
            ~/.cargo/registry
          key: engine-${{ runner.os }}-${{ steps.engine.outputs.version }}-${{ hashFiles('engine-bridge/Cargo.toml', 'engine-bridge/Cargo.lock', 'engine-bridge/src/**', 'support/engine-patches/**') }}
      - name: Build the engine
        run: scripts/engine.sh
